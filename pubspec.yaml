name: myapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0-278.1.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^2.15.1
  cloud_firestore: ^4.8.3
  firebase_auth: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"


flutter:
  uses-material-design: true

  assets:
    - assets/icon/icono-muni/icon.png
    - assets/icon/icono-muni/
    - assets/icon/categorias/
    - assets/icon/categoria-a/
